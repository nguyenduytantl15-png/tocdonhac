name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nếu bạn chỉ tải lên file TocDoNhac.zip thì tự giải nén
      - name: Giải nén mã nguồn (nếu có zip)
        run: |
          if [ -f TocDoNhac.zip ]; then unzip -o TocDoNhac.zip; fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TocDoNhac-apk
          path: app/build/outputs/apk/debug/*.apk
